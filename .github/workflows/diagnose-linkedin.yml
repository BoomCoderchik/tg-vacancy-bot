name: LinkedIn pipeline diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bot
        run: pip install .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Probe free discovery providers
        run: python -m tg_vacancy_bot.app diagnose-linkedin --use-default-profile --limit 10 --show-limit 5

      - name: Probe LinkedIn guest readability from this runner
        run: |
          python - <<'PY'
          import asyncio

          from playwright.async_api import async_playwright

          PROBE_URL = (
              "https://www.linkedin.com/posts/"
              "google-careers_googler-spotlight-introducing-the-recipients-of-the-"
              "activity-7349115548337954816-IU9X"
          )

          async def main() -> None:
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      headless=True,
                      args=["--disable-blink-features=AutomationControlled"],
                  )
                  context = await browser.new_context(
                      locale="en-US",
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                      ),
                      viewport={"width": 1366, "height": 768},
                  )
                  page = await context.new_page()
                  try:
                      response = await page.goto(PROBE_URL, wait_until="domcontentloaded", timeout=30000)
                      status = getattr(response, "status", None)
                      final_url = page.url
                      html = await page.content()
                      low = html.lower()
                      has_text = "attributed-text-segment-list__content" in low
                      login_wall = "input[type='password']" in low
                      authwall = "/authwall" in final_url.lower() or "/uas/login" in final_url.lower()
                      print(f"probe_status={status}")
                      print(f"final_host={final_url.split('/')[2] if '://' in final_url else final_url[:60]}")
                      print(f"final_path={final_url.split('linkedin.com')[-1][:80]}")
                      print(f"post_text_present={has_text} login_wall={login_wall} authwall={authwall}")
                  finally:
                      await context.close()
                      await browser.close()

          asyncio.run(main())
          PY
