name: Temporary search provider probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-search-providers
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe public search endpoints
        run: |
          pip install "aiohttp>=3.9,<4"
          python - <<'PY'
          import asyncio
          import base64
          import aiohttp

          UA = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }
          CHALLENGE_MARKERS = ("captcha", "unusual traffic", "challenge-form", "anomaly", "automated queries")

          INTENTS = [
              '(site:linkedin.com/posts OR site:linkedin.com/feed/update) ("we are hiring" OR "we\'re hiring" OR "hiring") ("junior frontend developer" OR "junior front-end developer" OR "intern frontend developer" OR "intern front-end developer")',
              '(site:linkedin.com/posts OR site:linkedin.com/feed/update) ("ищем" OR "ищет" OR "в команду" OR "наняем") ("джуниор фронтенд разработчик" OR "стажер фронтенд разработчик" OR "джуниор фулстек разработчик")',
          ]

          def decode_bing(href):
              if "/ck/a" not in href:
                  return href
              marker = "u=a1"
              i = href.find(marker)
              if i == -1:
                  return ""
              payload = href[i + len(marker):].split("&", 1)[0]
              padding = "=" * (-len(payload) % 4)
              try:
                  return base64.urlsafe_b64decode(payload + padding).decode("utf-8", "ignore")
              except Exception:
                  return ""

          def linkedin_count(text):
              return text.lower().count("linkedin.com/posts")

          async def report(session, name, url, params=None, data=None, check_b64=False):
              try:
                  if data:
                      async with session.post(url, params=params, data=data, headers=UA) as r:
                          text = await r.text(errors="ignore")
                  else:
                      async with session.get(url, params=params, headers=UA) as r:
                          text = await r.text(errors="ignore")
                  low = text.lower()
                  flags = [m for m in CHALLENGE_MARKERS if m in low]
                  li = linkedin_count(text)
                  extra = ""
                  if check_b64 and li == 0:
                      decoded = decode_bing_all(text)
                      li = sum(1 for u in decoded if "linkedin.com/posts" in u.lower())
                      sample = next((u for u in decoded if "linkedin.com" in u.lower()), "")
                      extra = f" decoded_li={li} sample={sample[:90]!r}"
                  print(f"{name}: HTTP {r.status} len={len(text)} markers={flags} raw_li={li}{extra}")
              except Exception as exc:
                  print(f"{name}: ERROR {type(exc).__name__}")

          def decode_bing_all(text):
              out = []
              for marker in ("u=a1",):
                  idx = 0
                  while True:
                      i = text.find(marker, idx)
                      if i == -1:
                          break
                      payload = text[i + len(marker):].split("&", 1)[0].split('"', 1)[0]
                      padding = "=" * (-len(payload) % 4)
                      try:
                          out.append(base64.urlsafe_b64decode(payload + padding).decode("utf-8", "ignore"))
                      except Exception:
                          pass
                      idx = i + len(marker)
              return out

          async def main():
              async with aiohttp.ClientSession() as s:
                  for n, q in enumerate(INTENTS):
                      await report(s, f"[intent{n}] bing_rss", "https://www.bing.com/search", {"q": q, "format": "rss", "setlang": "en"})
                      await asyncio.sleep(2)
                      await report(s, f"[intent{n}] bing_html", "https://www.bing.com/search", {"q": q, "first": "1", "setlang": "en"}, check_b64=True)
                      await asyncio.sleep(2)
                  await report(s, "bing_rss_simple", "https://www.bing.com/search", {"q": "site:linkedin.com/posts hiring junior frontend developer", "format": "rss", "setlang": "en"})
                  await asyncio.sleep(2)
                  await report(s, "ddg_html_post_q", "https://html.duckduckgo.com/html/", data={"q": INTENTS[0]})
                  await asyncio.sleep(2)
                  # Google News RSS: inspect what the items actually are
                  try:
                      async with s.get("https://news.google.com/rss/search", params={"q": "site:linkedin.com/posts hiring junior frontend", "hl": "en-US", "gl": "US", "ceid": "US:en"}, headers=UA) as r:
                          text = await r.text(errors="ignore")
                          li = linkedin_count(text)
                          sources = [seg.split("<")[0][:80] for seg in text.split("<source url=\"")[1:5]]
                          titles = [t.split("]]>")[0][:70] for t in text.split("<title>")[2:6]]
                          print(f"gnews_items: HTTP {r.status} items={text.count('<item>')} raw_li={li} sources={sources}")
                          print(f"gnews_titles: {titles}")
                  except Exception as exc:
                      print(f"gnews: ERROR {type(exc).__name__}")

          asyncio.run(main())
          PY
